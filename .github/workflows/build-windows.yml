name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python backend ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: osint-cli
        run: uv sync

      - name: Install PyInstaller
        working-directory: osint-cli
        run: uv pip install pyinstaller

      - name: Build backend with PyInstaller
        working-directory: osint-cli
        run: uv run pyinstaller api_server.spec --noconfirm

      # Copy PyInstaller output into Tauri resources folder
      - name: Stage backend into Tauri resources
        shell: pwsh
        run: |
          $src  = "osint-cli\dist\api_server"
          $dest = "osint-app\src-tauri\resources\api_server"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dest

      # ── Tauri frontend ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: osint-app
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: osint-app/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('osint-app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri app
        working-directory: osint-app
        run: npm run tauri:build -- --config src-tauri/tauri.windows.conf.json --bundles nsis

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: OSINT-NER-Tool-Windows
          path: osint-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
